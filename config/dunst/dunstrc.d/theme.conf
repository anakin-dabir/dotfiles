# Style and colors generated for the cupertino theme.

[global]
origin = top-right
offset = (14, 40)

transparency = 6
corner_radius = 14

frame_width = 1
frame_color = "#48484A"

font = Adwaita Sans 10
icon_theme = "WhiteSur, Adwaita""

format = "<span size='xx-large' font_desc='Cantarell 9' weight='bold' foreground='#0A84FF'>%s</span>\n%b"

[urgency_low]
timeout = 3
background = "#1C1C1E"
foreground = "#30D158"

[urgency_normal]
timeout = 5
background = "#1C1C1E"
foreground = "#F5F5F7"

[urgency_critical]
timeout = 0
background = "#1C1C1E"
foreground = "#FF453A"
