; The variables for the polybar modules are taken from this file.

;; Edit according to your system
;; Run `ls -1 /sys/class/power_supply/` to list list batteries and adapters.
;; Run `ls -1 /sys/class/backlight/` to list available graphics cards.
;; Run `ip link | awk '/state UP/ {print $2}' | tr -d :` to get active network interface.

[system]
sys_adapter = ADP1
sys_battery = BAT0
sys_graphics_card = intel_backlight
sys_network_interface = wlo1
;;sys_network_interface2 = 

;; ----- Bar items with a dropdown (any bar can use them: Control Center > Bar) -----

;; What's playing (hidden when nothing is). Click: the media dropdown
[module/media]
type = custom/script
exec = ~/.config/bspwm/bin/BarPanelData media-bar
interval = 2
click-left = BarPanel media
format = <label>
format-prefix = ${icons.media}
format-prefix-font = ${icons.media-font}
format-prefix-foreground = ${color.fg}
format-prefix-padding-right = 4pt
label = %output%
label-foreground = ${color.fg}

;; Weather now. Click: the forecast
[module/forecast]
type = custom/script
exec = ~/.config/bspwm/bin/BarPanelData weather-bar
interval = 60
format = "%{A1:BarPanel weather:}<label>%{A}"
label = %output%
label-foreground = ${color.fg}

;; Click: recent copies
[module/clipboard]
type = custom/text
click-left = BarPanel clipboard
label = ${icons.clipboard}
label-font = ${icons.clipboard-font}
label-foreground = ${color.fg}

;; Camera; a red timer while the screen is being recorded. Click: screenshot dropdown
[module/capture]
type = custom/script
exec = ~/.config/bspwm/bin/Capture bar
interval = 1
click-left = BarPanel capture
format = <label>
format-prefix = ${icons.capture}
format-prefix-font = ${icons.capture-font}
format-prefix-foreground = ${color.fg}
label = %output%
label-foreground = ${color.fg}
