; __  __           _       _


[module/date]
type = internal/date

interval = 1.0

time = %I:%M %P

format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel calendar:}"
format-prefix-padding-right = 3pt
label = "%time%%date%"
format-underline = ${color.indigo}

######################################################

[module/filesystem]
type = internal/fs

mount-0 = /
interval = 60
fixed-values = false

format-mounted = <label-mounted>
format-mounted-suffix = "%{A}"
format-mounted-prefix = "%{A1:BarPanel disk:}"
format-mounted-prefix-padding-right = 3pt
format-mounted-underline = ${color.red}

format-unmounted = <label-unmounted>
format-unmounted-suffix = "%{A}"
format-unmounted-prefix = "%{A1:BarPanel disk:}"
format-unmounted-prefix-padding-right = 3pt
format-unmounted-underline = ${color.red}

label-mounted = %used%
label-unmounted = %mountpoint%: not mounted

######################################################

[module/network]
type = internal/network
interface = ${system.sys_network_interface}

interval = 3.0
accumulate-stats = true
unknown-as-up = true
speed-unit = ""

format-connected = <label-connected>
format-connected-suffix = "%{A}"
format-connected-prefix = "%{A1:BarPanel network:}"
format-connected-prefix-padding-right = 3pt
label-connected = "%netspeed%"
format-connected-underline = ${color.orange}

format-disconnected = <label-disconnected>
format-disconnected-suffix = "%{A}"
format-disconnected-prefix = "%{A1:BarPanel network:}"
format-disconnected-prefix-padding-right = 3pt
label-disconnected = "Offline"
label-disconnected-foreground = ${color.red}
format-disconnected-underline = ${color.orange}

######################################################

[module/pulseaudio]
; custom/script instead of internal/pulseaudio: internal's left click is a
; fixed "mute"; here it opens the sound dropdown (bin/VolumeBar, bin/BarPanel)
type = custom/script
exec = VolumeBar --on '%{u@blue@}%{+u}%{O3pt}%percentage%%{-u}' --off '%{u@blue@}%{+u}%{O3pt}%{F@red@}Muted%{F-}%{-u}'
tail = true
format = <label>
label = %output%
click-left = BarPanel sound
click-right = OpenApps --soundcontrol
scroll-up = pamixer -i 5
scroll-down = pamixer -d 5

[module/brightness]
type = internal/backlight
card = ${system.sys_graphics_card}

enable-scroll = false

format = "%{A1:BarPanel battery:}<ramp><label>%{A}"
format-underline = ${color.yellow}
label = %percentage%%

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-font = 3
ramp-padding-right = 3pt

######################################################

[module/battery]
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
time-format = %H:%M

format-charging = "%{A1:BarPanel battery:}<animation-charging><label-charging>%{A}"
format-charging-underline = ${color.indigo}
label-charging = %percentage%%

format-discharging = "%{A1:BarPanel battery:}<ramp-capacity><label-discharging>%{A}"
format-discharging-underline = ${color.indigo}
label-discharging = %percentage%%

format-full = <label-full>
format-full-suffix = "%{A}"
format-full-underline = ${color.indigo}
format-full-prefix = "%{A1:BarPanel battery:}"
format-full-prefix-font = 3
format-full-prefix-padding-right = 3pt
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-font = 3
ramp-capacity-padding-right = 3pt

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-font = 3
animation-charging-padding-right = 3pt
animation-charging-framerate = 700

######################################################

[module/weather]
type = custom/script
exec = Weather wmodule
interval = 900
format = <label>
label = %output%
format-underline = ${color.yellow}

######################################################

[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false

format = <label-state>
format-font = 2

label-focused = 󰺕
label-focused-padding = 1
label-focused-foreground = ${color.lime}

label-occupied = 󰀚
label-occupied-padding = 1

label-urgent = 󰀚
label-urgent-padding = 0

label-empty = 󰑊
label-empty-padding = 1
label-empty-foreground = ${color.grey}

######################################################

[module/title]
type = internal/xwindow

format = "%{A1:BarPanel windows:}<label>%{A}"
format-prefix = 󱂬
format-prefix-padding-right = 3pt
format-prefix-foreground = ${color.pink}

label = %title%
label-maxlen = 35

label-empty = Arch Linux
label-empty-foreground = ${color.grey}

######################################################

[module/updates]
type = custom/ipc

hook-0 = cat $HOME/.cache/Updates.txt 2>/dev/null
initial = 1

format = <label>
format-prefix = 
format-prefix-padding-right = 3pt
format-underline = ${color.green}

label = %output%

click-left = OpenApps --checkupdates

######################################################

[module/launcher]
type = custom/text

label = 󰣇
label-font = 4
label-foreground = ${color.fg}

click-left = OpenApps --menu
click-right = RiceSelector

######################################################

[module/sep]
type = custom/text
label = " "
label-padding = 3pt
label-foreground = ${color.bg-alt}

######################################################

[module/sep2]
type = custom/text
label = " 󰇙 "
label-font = 2
label-foreground = ${color.indigo}

######################################################

[module/cpu_bar]
type = internal/cpu

interval = 0.5

format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel cpu:}"
format-prefix-padding-right = 3pt
label = %percentage%%
format-underline = ${color.cyan}

######################################################

[module/memory_bar]
type = internal/memory

interval = 3

format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel memory:}"
format-prefix-padding-right = 3pt
format-underline = ${color.purple}

label = %used%

######################################################

[module/mplayer]
type = custom/text
label = 
label-padding-right = 1
label-foreground = ${color.green}

click-left = OpenApps --player
click-right = OpenApps --music

[module/usercard]
type = custom/text
label = 
label-padding-right = 1
label-foreground = ${color.cyan}

click-left = OpenApps --usercard

[module/power]
type = custom/text
label = 
label-foreground = ${color.red}

click-left = BarPanel power

######################################################

[module/tray]
type = internal/tray

format = <tray>
format-background = ${color.bg}
tray-background = ${color.bg}
tray-foreground = ${color.fg}
tray-spacing = 5px
tray-padding = 0px
tray-size = 38%

#####################################################

[module/bluetooth]
type = custom/script
exec = bluetooth-polybar.sh
interval = 3

format = <label>
format-font = 2
format-underline = ${color.blue}
label = "%output%"
click-left = OpenApps --bluetooth

#####################################################

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-prefix = ""
format-prefix-padding-right = 3pt
format-prefix-font = 2
format-underline = ${color.purple}

label-layout = %{A1:OpenApps --keyboard:}%layout%%{A}

#####################################################

[module/colorpicker]
type = custom/text
label = ""
label-foreground = ${color.pink}
label-padding-right = 1
click-left = Colorpicker

#####################################################

[module/layout]
type = custom/ipc
hook-0 = Layout icon
initial = 1

label-font = 5
click-left = Layout next
click-right = Layout prev

[module/notifications]
type = custom/ipc
hook-0 = NotifyCenter --bar
initial = 1
format = <label>
label = %output%
label-font = 6
click-left = NotifyCenter
click-right = NotifyCenter --dnd
######################################################
