; __  __           _       _


[module/date]
type = internal/date

interval = 1.0

time = %I:%M %P
format-foreground = ${color.fg}

format = "%{A1:BarPanel calendar:}<label>%{A}"
label = "%time%%date%"

######################################################

[module/filesystem]
type = internal/fs

mount-0 = /

interval = 60
fixed-values = true

format-mounted = <label-mounted>
format-mounted-suffix = "%{A}"
format-mounted-prefix-font = 2
format-mounted-prefix = "%{A1:BarPanel disk:}󰄦"

format-unmounted = <label-unmounted>
format-unmounted-suffix = "%{A}"
format-unmounted-prefix-font = 2
format-unmounted-prefix = "%{A1:BarPanel disk:}󰄦"

label-mounted = "%used% "
label-mounted-padding-left = 8pt
label-mounted-foreground = ${color.green}

label-unmounted = %mountpoint%: not mounted
label-unmounted-padding-left = 8pt
label-unmounted-foreground = ${color.green}

######################################################

[module/network]
type = internal/network
interface = ${system.sys_network_interface}

interval = 3.0
accumulate-stats = true
unknown-as-up = true
speed-unit = ""

format-connected = <label-connected>
format-connected-suffix = "%{A}"
format-connected-prefix = "%{A1:BarPanel network:}󰖩"
format-connected-prefix-font = 2
label-connected = "%netspeed%  "
label-connected-padding-left = 8pt
label-connected-foreground = ${color.green}

format-disconnected = <label-disconnected>
format-disconnected-suffix = "%{A}"
format-disconnected-prefix = "%{A1:BarPanel network:}󰖪"
format-disconnected-prefix-font = 2
label-disconnected = "Offline  "
label-disconnected-padding-left = 8pt
label-disconnected-foreground = ${color.green}

######################################################

[module/pulseaudio]
; custom/script instead of internal/pulseaudio: internal's left click is a
; fixed "mute"; here it opens the sound dropdown (bin/VolumeBar, bin/BarPanel)
type = custom/script
exec = VolumeBar --on '%{T2}%{F@green@}%{O8pt}%percentage% %{F-}%{T-}' --off '%{T2}%{T-}%{F@red@}%{O8pt}Muted %{F-}'
tail = true
format = <label>
label = %output%
click-left = BarPanel sound
click-right = OpenApps --soundcontrol
scroll-up = pamixer -i 5
scroll-down = pamixer -d 5

[module/brightness]
type = internal/backlight
card = ${system.sys_graphics_card}

enable-scroll = false

format = "%{A1:BarPanel battery:}<ramp><label>%{A}"
label = "%percentage%%"
label-padding = 8pt
label-foreground = ${color.green}

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-font = 2

######################################################

[module/battery]
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
time-format = %H:%M

format-charging = "%{A1:BarPanel battery:}<animation-charging><label-charging>%{A}"
label-charging = %percentage%%
label-charging-foreground = ${color.green}
label-charging-padding = 8pt

format-discharging = "%{A1:BarPanel battery:}<ramp-capacity><label-discharging>%{A}"
label-discharging = %percentage%%
label-discharging-foreground = ${color.green}
label-discharging-padding = 8pt

format-full = <label-full>
format-full-suffix = "%{A}"
format-full-prefix = "%{A1:BarPanel battery:}"
format-full-prefix-font = 2
;;format-full-prefix-foreground = ${color.green}
label-full = %percentage%%
label-full-foreground = ${color.green}
label-full-padding = 8pt

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
;;ramp-capacity-foreground = ${color.yellow}
ramp-capacity-font = 2

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
;;animation-charging-foreground = ${color.green}
animation-charging-font = 2
animation-charging-framerate = 700

######################################################

[module/weather]
type = custom/script
exec = Weather wmodule
interval = 900
format = <label>
label = " %output%"

######################################################

[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false

ws-icon-0 = 1;󰫮
ws-icon-1 = 2;󰫯
ws-icon-2 = 3;󰫰
ws-icon-3 = 4;󰫱
ws-icon-4 = 5;󰫲
ws-icon-5 = 6;󰫳
ws-icon-default = "♟"

format = <label-state>
format-font = 5

label-focused = %icon%
label-focused-foreground = ${color.fg}

label-occupied = %icon%
label-occupied-foreground= ${color.green}

label-urgent = %icon%
label-urgent-foreground= ${color.green}

label-empty = %icon%
label-empty-foreground = ${color.blue}

######################################################

[module/title]
type = internal/xwindow

format = "%{A1:BarPanel windows:}<label>%{A}"
format-prefix =

label = %title%
label-foreground = ${color.green}
label-maxlen = 35

label-empty = "Arch Linux"
label-empty-foreground = ${color.black-bright}

######################################################

[module/updates]
type = custom/ipc

hook-0 = cat $HOME/.cache/Updates.txt 2>/dev/null
initial = 1

format = <label>
format-prefix = ""
format-prefix-font = 2

label = "%output% "
label-padding-left = 8pt
label-foreground = ${color.green}

click-left = OpenApps --checkupdates

######################################################

[module/launcher]
type = custom/text
label = 󰣇
label-font = 3
label-foreground = ${color.red}

click-left = OpenApps --menu
click-right = OpenApps --rice

######################################################

[module/sep]
type = custom/text
label = " "
label-foreground = ${color.bg}

######################################################

[module/sep2]
type = custom/text
label = " "
label-font = 4
label-foreground = ${color.yellow}

######################################################

[module/cpu_bar]
type = internal/cpu

interval = 0.5
format = <label>
format-suffix = "%{A}"
format-font = 2
format-prefix = "%{A1:BarPanel cpu:}"

label = "%percentage%% "
label-padding-left = 8pt
label-foreground = ${color.green}

######################################################

[module/memory_bar]
type = internal/memory

interval = 3

;; agregar <bar-used> antes de label para agregar barrita chida
format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel memory:}󰄧"
format-font = 2

label = "%used% "
label-padding-left = 8pt
label-foreground = ${color.green}

######################################################

[module/mpd_control]
type            = internal/mpd
host            = 127.0.0.1
port            = 6600
interval        = 2

format-online   = <icon-prev><toggle><icon-next>
format-offline  = <label-offline>
label-offline = "󰎊 No Music"
label-offline-font = 2

icon-play               = " %{T2} "
icon-pause              = " %{T2} "
icon-stop               = " %{T2} "
icon-prev               = " %{T2} "
icon-next               = " %{T2}"

format-offline-foreground = ${color.grey}
icon-play-foreground    = ${color.fg}
icon-pause-foreground   = ${color.fg}
icon-stop-foreground    = ${color.fg}
icon-prev-foreground    = ${color.fg}
icon-next-foreground    = ${color.fg}
toggle-on-foreground    = ${color.green}
toggle-off-foreground   = ${color.red}

######################################################

[module/spl]
type = custom/text
label = "["
label-padding-right = 3pt
label-font = 2
label-foreground = ${color.blue}

[module/spr]
type = custom/text
label = "]"
label-padding-left = 3pt
label-font = 2
label-foreground = ${color.blue}

[module/mplayer]
type = custom/text
label = " "
label-padding-right = 3pt
label-font = 2
label-foreground = ${color.green}

click-left = OpenApps --player
click-right = OpenApps --music

[module/usercard]
type = custom/text
label =  " "
label-font = 2
label-foreground = ${color.green}

click-left = OpenApps --usercard

[module/power]
type = custom/text
label = " "
label-font = 2
label-foreground = ${color.red}

click-left = BarPanel power

#####################################################

[module/tray]
type = internal/tray

format = <tray>
format-background = ${color.bg}
tray-background = ${color.bg}
tray-foreground = ${color.fg}
tray-spacing = 5px
tray-padding = 0px
tray-size = 50%

#####################################################

[module/bluetooth]
type = custom/script
exec = bluetooth-polybar.sh
interval = 3

format = <label>
format-font = 2
label = "%output% "
click-left = OpenApps --bluetooth

#####################################################

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-prefix = "󰌌"
format-prefix-padding-right = 8pt
format-prefix-font = 2

label-layout = "%{A1:OpenApps --keyboard:}%layout%%{A} "
label-layout-foreground = ${color.green}

#####################################################

[module/colorpicker]
type = custom/text
label = "󰈋"
label-font = 2
label-foreground = ${color.green}
click-left = Colorpicker

#####################################################

[module/layout]
type = custom/ipc
hook-0 = Layout icon
initial = 1

label-font = 6
click-left = Layout next
click-right = Layout prev

[module/notifications]
type = custom/ipc
hook-0 = NotifyCenter --bar
initial = 1
format = <label>
label = "%output% "
label-font = 7
label-padding-left = 8pt
label-foreground = ${color.green}
click-left = NotifyCenter
click-right = NotifyCenter --dnd
######################################################
