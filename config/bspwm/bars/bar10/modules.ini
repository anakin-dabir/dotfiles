; __  __           _       _


[module/date]
type = internal/date

interval = 1.0

time = %I:%M %P
format-foreground = ${color.fg}

format = "%{A1:BarPanel calendar:}<label>%{A}"
label = "%time%%date%"

######################################################

[module/filesystem]
type = internal/fs

mount-0 = /

interval = 60
fixed-values = false

format-mounted = <label-mounted>
format-mounted-suffix = "%{A}"
format-mounted-prefix = "%{A1:BarPanel disk:}"
format-mounted-prefix-padding = 3pt
format-mounted-prefix-foreground = ${color.orange}

format-unmounted = <label-unmounted>
format-unmounted-suffix = "%{A}"
format-unmounted-prefix = "%{A1:BarPanel disk:}"
format-unmounted-prefix-padding = 3pt

label-mounted = "%used%"
label-unmounted = " %mountpoint%: not mounted"

######################################################

[module/network]
type = internal/network
interface = ${system.sys_network_interface}

interval = 3.0
accumulate-stats = true
unknown-as-up = true

format-connected = <label-connected>
format-connected-suffix = "%{A}"
format-connected-prefix = "%{A1:BarPanel network:}祐"
format-connected-prefix-padding = 3pt
format-connected-foreground = ${color.green}

format-disconnected = <label-disconnected>
format-disconnected-suffix = "%{A}"
format-disconnected-prefix = "%{A1:BarPanel network:}禎"
format-disconnected-prefix-padding = 3pt
format-disconnected-foreground = ${color.red}

speed-unit = ""
label-connected = "%netspeed%"
label-connected-foreground = ${color.amber}
label-disconnected = "Offline"
label-disconnected-foreground = ${color.red}

######################################################

[module/pulseaudio]
; custom/script instead of internal/pulseaudio: internal's left click is a
; fixed "mute"; here it opens the sound dropdown (bin/VolumeBar, bin/BarPanel)
type = custom/script
exec = VolumeBar --on '%{F@blue@}%{O3pt}領%{O3pt}%{F@fg@}%percentage%%{F-}%{F-}' --off '%{O3pt}尿%{O3pt}%{F@red@}Muted%{F-}'
tail = true
format = <label>
label = %output%
click-left = BarPanel sound
click-right = OpenApps --soundcontrol
scroll-up = pamixer -i 5
scroll-down = pamixer -d 5

[module/brightness]
type = internal/backlight
card = ${system.sys_graphics_card}

enable-scroll = true

format = "%{A1:BarPanel battery:}<ramp><label>%{A}"
label = %percentage%%
label-padding = 3pt

ramp-0 = 
ramp-1 = 
ramp-foreground = ${color.yellow}

######################################################

[module/battery]
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
time-format = %H:%M

format-charging = "%{A1:BarPanel battery:}<animation-charging><label-charging>%{A}"
format-charging-prefix-foreground = ${color.red}
label-charging = %percentage%%

format-discharging = "%{A1:BarPanel battery:}<ramp-capacity><label-discharging>%{A}"
label-discharging = %percentage%%

format-full = <label-full>
format-full-suffix = "%{A}"
format-full-prefix = "%{A1:BarPanel battery:}"
format-full-prefix-padding = 3pt
format-full-prefix-foreground = ${color.green}
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-padding = 3pt
ramp-capacity-foreground = ${color.blue}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-padding = 3pt
animation-charging-foreground = ${color.green}
animation-charging-framerate = 700

######################################################

[module/weather]
type = custom/script
exec = Weather wmodule
interval = 900
format = <label>
label = " %output% "

######################################################

[module/title]
type = internal/xwindow

format = <label>
format-prefix = " "
format-prefix-foreground = ${color.lime}

label = "%title%"
label-maxlen = 45

label-empty = " Arch Linux"
label-empty-foreground = ${color.grey}

######################################################

[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false

ws-icon-0 = I;󰎡
ws-icon-1 = II;󰎤
ws-icon-2 = III;󰎧
ws-icon-3 = IV;󰎪
ws-icon-4 = V;󰎭
ws-icon-5 = VI;󰎱
ws-icon-6 = VII;󰎳
ws-icon-7 = VIII;󰎶
ws-icon-8 = IX;󰎹
ws-icon-9 = X;󰎼

ws-icon-default = "♟"

format = <label-state>

label-focused = %icon%
label-focused-background = ${color.bg}
label-focused-foreground = ${color.pink}

label-occupied = %icon%
label-occupied-background = ${color.bg}
label-occupied-foreground= ${color.lime}

label-urgent = %icon%
label-urgent-background = ${color.bg}
label-urgent-foreground= ${color.lime}

label-empty = %icon%
label-empty-background = ${color.bg}
label-empty-foreground = ${color.fg}

label-separator = " "

######################################################

[module/updates]
type = custom/ipc

hook-0 = cat $HOME/.cache/Updates.txt 2>/dev/null
initial = 1

format = <label>
format-prefix = "螺"
format-prefix-padding = 3pt
format-prefix-foreground = ${color.lime}

label = %output%

click-left = OpenApps --checkupdates

######################################################

[module/launcher]
type = custom/text

label = "󰣇"
label-foreground = ${color.blue-arch}

click-left = OpenApps --menu
click-right = OpenApps --rice

######################################################

[module/sep]
type = custom/text

label = " "
label-padding = 2pt

[module/sep2]
type = custom/text

label = ""
label-padding = 3pt
label-foreground = ${color.blue-arch}

######################################################

[module/cpu_bar]
type = internal/cpu

interval = 0.5
;;<bar-load>
format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel cpu:}"
format-prefix-padding = 3pt
format-prefix-foreground = ${color.pink}

label = "%percentage%%"

######################################################

[module/memory_bar]
type = internal/memory

interval = 3

format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel memory:}"
format-prefix-padding = 3pt
format-prefix-foreground = ${color.yellow}

label = "%used%"

######################################################

[module/mplayer]
type = custom/text
label = " "
label-foreground = ${color.green}

click-left = OpenApps --player
click-right = OpenApps --music

[module/usercard]
type = custom/text
label =  "飼"
label-foreground = ${color.cyan}

click-left = OpenApps --usercard

[module/power]
type = custom/text
label = "累"
label-foreground = ${color.red}

click-left = OpenApps --powermenu

#####################################################

[module/tray]
type = internal/tray

format = <tray>
format-background = ${color.bg}
tray-background = ${color.bg}
tray-foreground = ${color.fg}
tray-spacing = 5px
tray-padding = 0px
tray-size = 37%

#####################################################

[module/bluetooth]
type = custom/script
exec = bluetooth-polybar.sh
interval = 3

format = <label>
label = "%output%"
click-left = OpenApps --bluetooth

#####################################################

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${color.yellow}

label-layout = %{A1:OpenApps --keyboard:}%layout%%{A}

#####################################################

[module/colorpicker]
type = custom/text
label = "珞"
label-foreground = ${color.pink}
click-left = Colorpicker

#####################################################

[module/layout]
type = custom/ipc
hook-0 = Layout icon
initial = 1

label-font = 4
click-left = Layout next
click-right = Layout prev

[module/notifications]
type = custom/ipc
hook-0 = NotifyCenter --bar
initial = 1
format = <label>
label = %output%
label-font = 5
label-foreground = ${color.lime}
label-padding = 3pt
click-left = NotifyCenter
click-right = NotifyCenter --dnd
######################################################
