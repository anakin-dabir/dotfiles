; Floating: a rounded bar that floats just under the top edge of the screen.
; Colours follow the theme (../colors.ini).

[global/wm]
margin-bottom = 0
margin-top = 0
include-file = ../../config/system.ini
include-file = ../colors.ini
include-file = modules.ini

[bar/floating]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false
fixed-center = true
bottom = false
width = 100%:-24
height = 34
offset-x = 12
offset-y = 8
radius = 12
background = ${color.bg}
foreground = ${color.fg}
border-size = 1
border-color = ${color.bg-alt}
padding-left = 2
padding-right = 2
module-margin = 1
line-size = 0
wm-restack = bspwm
enable-ipc = true
cursor-click = pointer
separator = ""
dim-value = 1.0
font-0 = "Adwaita Sans:size=10;2"
font-1 = "Adwaita Sans:style=Medium:size=10;2"
font-2 = "Phosphor:size=11;3"
font-3 = "Material Design Icons Desktop:size=13;3"
; notification bell (bin/NotifyCenter) and the icons of the shared items
font-4 = "Symbols Nerd Font:size=12;3"
modules-left = launcher bspwm title
modules-center = date
modules-right = tray media forecast clipboard capture pulseaudio network battery notifications power

; Icons of the shared bar items (config/system.ini); Control Center > Bar
; changes them. font: which font-N draws them, plus one (0 = any font)
[icons]
font = 3
media = 
clipboard = 
capture = 
