[module/date]

type = internal/date

interval = 1.0

format = "%{A1:BarPanel calendar:}<label>%{A}"

######################################################
time = "%H:%M"
date = "%a %e %b"
label = "%date%  %time%"
label-font = 2
label-foreground = ${color.fg}

[module/filesystem]

type = internal/fs

mount-0 = /

interval = 60
fixed-values = false

format-mounted = <label-mounted>
format-mounted-suffix = "%{A}"
format-mounted-prefix = "%{A1:BarPanel disk:}"

format-unmounted = <label-unmounted>
format-unmounted-suffix = "%{A}"
format-unmounted-prefix = "%{A1:BarPanel disk:}"

label-mounted = "%used%"
label-unmounted = " %mountpoint%: not mounted"

######################################################
format-foreground = ${color.fg}
format-mounted-prefix-foreground = ${color.fg}
format-mounted-prefix-padding = 5pt
format-unmounted-prefix-foreground = ${color.fg}
format-unmounted-prefix-padding = 5pt
format-mounted-foreground = ${color.fg}
format-unmounted-foreground = ${color.fg}

[module/network]

type = internal/network
interface = ${system.sys_network_interface}

interval = 3.0
accumulate-stats = true
unknown-as-up = true

format-connected = <label-connected>
format-connected-suffix = "%{A}"
format-connected-prefix = "%{A1:BarPanel network:}祐"

format-disconnected = <label-disconnected>
format-disconnected-suffix = "%{A}"
format-disconnected-prefix = "%{A1:BarPanel network:}禎"

speed-unit = ""
label-connected = "%netspeed%"

label-disconnected = "Offline"

######################################################
format-foreground = ${color.fg}
format-connected-prefix-foreground = ${color.fg}
format-connected-prefix-padding = 5pt
format-disconnected-prefix-foreground = ${color.fg}
format-disconnected-prefix-padding = 5pt
format-connected-foreground = ${color.fg}
format-disconnected-foreground = ${color.fg}

[module/pulseaudio]
; custom/script instead of internal/pulseaudio: internal's left click is a fixed
; "mute"; here left click opens the sound dropdown (bin/VolumeBar, bin/BarPanel)
type = custom/script
exec = VolumeBar "領" "尿" 5pt
tail = true
format = <label>
label = %output%
format-foreground = ${color.fg}
click-left = BarPanel sound
click-right = OpenApps --soundcontrol
scroll-up = pamixer -i 5
scroll-down = pamixer -d 5

[module/brightness]

type = internal/backlight
card = ${system.sys_graphics_card}

enable-scroll = true

format = <ramp><label>
label = %percentage%%
label-padding = 3pt

ramp-0 = 
ramp-1 = 
ramp-foreground = ${color.yellow}

######################################################
format-foreground = ${color.fg}

[module/battery]

type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
time-format = %H:%M

format-charging = "%{A1:BarPanel battery:}<animation-charging><label-charging>%{A}"

label-charging = %percentage%%

format-discharging = "%{A1:BarPanel battery:}<ramp-capacity><label-discharging>%{A}"
label-discharging = %percentage%%

format-full = <label-full>
format-full-suffix = "%{A}"
format-full-prefix = "%{A1:BarPanel battery:}"

label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-padding = 3pt
ramp-capacity-foreground = ${color.blue}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-padding = 3pt
animation-charging-foreground = ${color.green}
animation-charging-framerate = 700

######################################################
format-foreground = ${color.fg}
format-full-prefix-foreground = ${color.fg}
format-full-prefix-padding = 5pt
format-charging-foreground = ${color.fg}
format-discharging-foreground = ${color.fg}
format-full-foreground = ${color.fg}

[module/weather]

type = custom/script
exec = Weather wmodule
interval = 900
format = <label>
label = " %output% "

######################################################
format-foreground = ${color.fg}

[module/title]

type = internal/xwindow

format = "%{A1:BarPanel windows:}<label>%{A}"
format-prefix = " "

label = "%title%"
label-maxlen = 45

label-empty = " Arch Linux"

######################################################
format-foreground = ${color.fg}
label-font = 2

[module/bspwm]

type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false

ws-icon-0 = I;󰎡
ws-icon-1 = II;󰎤
ws-icon-2 = III;󰎧
ws-icon-3 = IV;󰎪
ws-icon-4 = V;󰎭
ws-icon-5 = VI;󰎱
ws-icon-6 = VII;󰎳
ws-icon-7 = VIII;󰎶
ws-icon-8 = IX;󰎹
ws-icon-9 = X;󰎼

ws-icon-default = "♟"

format = <label-state>

label-separator = " "

######################################################
label-focused = ●
label-focused-foreground = ${color.blue}
label-focused-padding = 1
label-occupied = ●
label-occupied-foreground = ${color.muted}
label-occupied-padding = 1
label-empty =
label-urgent = ●
label-urgent-foreground = ${color.red}
label-urgent-padding = 1

[module/updates]

type = custom/ipc

hook-0 = cat $HOME/.cache/Updates.txt 2>/dev/null
initial = 1

format = <label>
format-prefix = "螺"

label = %output%

click-left = OpenApps --checkupdates
click-right = OpenApps --update

######################################################
format-foreground = ${color.fg}
format-prefix-foreground = ${color.fg}
format-prefix-padding = 5pt

[module/launcher]

type = custom/text

label = "󰣇"
label-foreground = ${color.blue-arch}

click-left = OpenApps --menu
click-right = OpenApps --rice

######################################################
format-foreground = ${color.fg}

[module/sep]

type = custom/text

label = " "
label-padding = 2pt

[module/sep2]

type = custom/text

label = ""
label-padding = 3pt
label-foreground = ${color.blue-arch}

######################################################

[module/cpu_bar]

type = internal/cpu

interval = 0.5
;;<bar-load>
format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel cpu:}"

label = "%percentage%%"

######################################################
format-foreground = ${color.fg}
format-prefix-foreground = ${color.fg}
format-prefix-padding = 5pt

[module/memory_bar]

type = internal/memory

interval = 3

format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel memory:}"

label = "%used%"

######################################################
format-foreground = ${color.fg}
format-prefix-foreground = ${color.fg}
format-prefix-padding = 5pt

[module/mplayer]

type = custom/text
label = " "
label-foreground = ${color.green}

click-left = OpenApps --player
click-right = OpenApps --music
format-foreground = ${color.fg}

[module/usercard]

type = custom/text
label =  "飼"
label-foreground = ${color.cyan}

click-left = OpenApps --usercard
format-foreground = ${color.fg}

[module/power]

type = custom/text
label = "累"
label-foreground = ${color.fg}

click-left = BarPanel power

#####################################################
format-foreground = ${color.fg}

[module/tray]

type = internal/tray

format = <tray>

tray-background = ${color.bg}
tray-foreground = ${color.fg}
tray-spacing = 5px
tray-padding = 0px
tray-size = 55%

#####################################################

[module/bluetooth]

type = custom/script
exec = bluetooth-polybar.sh
interval = 3

format = <label>
label = "%output%"
click-left = OpenApps --bluetooth

#####################################################
format-foreground = ${color.fg}

[module/xkeyboard]

type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-prefix = " "

label-layout = %{A1:OpenApps --keyboard:}%layout%%{A}
format-foreground = ${color.fg}
format-prefix-foreground = ${color.fg}
format-prefix-padding = 5pt

#####################################################

[module/notifications]

type = custom/ipc
hook-0 = NotifyCenter --bar
initial = 1

format = <label>
label = %output%
label-font = 5
label-foreground = ${color.fg}

click-left = NotifyCenter
click-right = NotifyCenter --dnd
