; Cupertino (dark) — menubar + app dock

[global/wm]
margin-bottom = 0
margin-top = 0
include-file = ../../config/system.ini
include-file = modules.ini

[color]
bg = #B31C1C1E
dock = #C22C2C2E
fg = #F5F5F7
muted = #98989D
blue-arch = #F5F5F7
red = #FF453A
pink = #FF375F
purple = #BF5AF2
blue = #0A84FF
cyan = #0A84FF
teal = #30D158
green = #30D158
lime = #30D158
yellow = #FF9F0A
amber = #FF9F0A
orange = #FF9F0A
brown = #98989D
grey = #98989D
indigo = #BF5AF2
blue-gray = #98989D

[bar/menubar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false
fixed-center = true
bottom = false
width = 100%
height = 26
offset-x = 0
offset-y = 0
radius = 0
background = ${color.bg}
foreground = ${color.fg}
padding-left = 2
padding-right = 2
module-margin = 1
line-size = 0
border-size = 0
wm-restack = bspwm
enable-ipc = true
cursor-click = pointer
separator = ""
dim-value = 1.0
font-0 = "Adwaita Sans:size=10;2"
font-1 = "Adwaita Sans:style=Medium:size=10;2"
font-2 = "Phosphor:size=11;3"
font-3 = "Material Design Icons Desktop:size=13;3"
; notification bell (bin/NotifyCenter)
font-4 = "Symbols Nerd Font:size=12;3"
modules-left = launcher title
modules-right = tray media forecast clipboard capture cpu_bar memory_bar filesystem pulseaudio network battery date notifications power

[settings]
screenchange-reload = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
