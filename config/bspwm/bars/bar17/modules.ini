; __  __           _       _


[module/date]
type = internal/date

interval = 1.0

time = "%I:%M %P "
format-background = ${color.blue}
format-foreground = ${color.bg}

format = "%{A1:BarPanel calendar:}<label>%{A}"
format-font = 2

label = " %time%%date% "
label-font = 1

######################################################

[module/filesystem]
type = internal/fs

mount-0 = /
interval = 60
fixed-values = true

format-mounted = <label-mounted>
format-mounted-suffix = "%{A}"
format-mounted-prefix = "%{A1:BarPanel disk:} "
format-mounted-prefix-foreground = ${color.blue}
format-mounted-prefix-font = 4

format-unmounted = <label-unmounted>
format-unmounted-suffix = "%{A}"
format-unmounted-prefix-font = 4
format-unmounted-prefix = "%{A1:BarPanel disk:} "
format-unmounted-prefix-foreground = ${color.blue}

label-mounted = "%used%"
label-unmounted = "%mountpoint%: not mounted"

######################################################

[module/network]
type = internal/network
interface = ${system.sys_network_interface}

interval = 3.0
accumulate-stats = true
unknown-as-up = true

format-connected = "%{A1:BarPanel network:}<label-connected>%{A}"

speed-unit = ""
label-connected = ""
label-connected-font = 4
label-connected-foreground = ${color.blue}

format-disconnected = "%{A1:BarPanel network:}<label-disconnected>%{A}"

label-disconnected = "Offline"
label-disconnected-foreground = ${color.red}

######################################################

[module/pulseaudio]
; custom/script instead of internal/pulseaudio: internal's left click is a
; fixed "mute"; here it opens the sound dropdown (bin/VolumeBar, bin/BarPanel)
type = custom/script
exec = VolumeBar --on '%{F@blue@}%{T4}@ramp@%{T-} @bar@%{F-}' --off '%{F@blue@}%{T4} %{T-}%{F@red@}Muted%{F-}%{F-}' --ramp '||||' --bar '7|%{F@blue@}-%{F-}|%{F@blue@}%{T4}%{T-}%{F-}|%{F@blue@}-%{F-}'
tail = true
format = <label>
label = %output%
click-left = BarPanel sound
click-right = OpenApps --soundcontrol
scroll-up = pamixer -i 5
scroll-down = pamixer -d 5

[module/brightness]
type = internal/backlight
card = ${system.sys_graphics_card}

enable-scroll = false

format = "%{A1:BarPanel battery:}<ramp><label>%{A}"
label = %percentage%%
label-padding-left = 3pt

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-font = 4
ramp-foreground = ${color.yellow}

######################################################

[module/battery]
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
time-format = %H:%M

format-charging = "%{A1:BarPanel battery:}<animation-charging><label-charging>%{A}"
label-charging = %percentage%%
label-charging-padding-left = 3pt

format-discharging = "%{A1:BarPanel battery:}<ramp-capacity><label-discharging>%{A}"
label-discharging = %percentage%%
label-discharging-padding-left = 3pt

format-full = <label-full>
format-full-suffix = "%{A}"
format-full-prefix = "%{A1:BarPanel battery:}"
format-full-prefix-font = 4
format-full-prefix-foreground = ${color.cyan}
label-full = %percentage%%
label-full-padding-left = 3pt

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${color.blue}
ramp-capacity-font = 4

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${color.blue}
animation-charging-font = 4
animation-charging-framerate = 700

######################################################

[module/weather]
type = custom/script
exec = Weather wmodule
interval = 900
format = <label>
label = "%output%"
label-foreground = ${color.blue}

######################################################

[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false

ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;
ws-icon-default = "♟"

format = <label-state>
format-font = 2

label-focused = %icon%
label-focused-padding = 2
label-focused-foreground = ${color.bg}
label-focused-background = ${color.blue}

label-occupied = %icon%
label-occupied-padding = 2
label-occupied-foreground= ${color.indigo}

label-urgent = %icon%
label-urgent-padding = 2
label-urgent-foreground= ${color.indigo}

label-empty = %icon%
label-empty-padding = 2
label-empty-foreground = ${color.blue-gray}

######################################################

[module/title]
type = internal/xwindow

format = <label>
format-prefix =

label = %title%
label-foreground = ${color.blue}
label-maxlen = 35

label-empty = "Arch Linux"

######################################################

[module/updates]
type = custom/ipc

hook-0 = cat $HOME/.cache/Updates.txt 2>/dev/null
initial = 1

format = <label>
format-prefix = " "
format-prefix-font = 4
format-prefix-foreground = ${color.blue}

label = %output%

click-left = OpenApps --checkupdates

######################################################

[module/launcher]
type = custom/text

label = "󰣇"
label-foreground = ${color.blue-arch}
label-font = 3
label-padding-left = 10px

click-left = OpenApps --menu
click-right = RiceSelector

######################################################

[module/sep]
type = custom/text
label = " "
label-foreground = ${color.bg}

######################################################

[module/cpu_bar]
type = internal/cpu

interval = 0.5

format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel cpu:} "
format-prefix-foreground = ${color.blue}
format-prefix-font = 4

label = "%percentage%%"

######################################################

[module/memory_bar]
type = internal/memory

interval = 3

format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel memory:} "
format-prefix-foreground = ${color.blue}
format-prefix-font = 4

label = "%used%"

######################################################

[module/mpd_control]
type            = internal/mpd
host            = 127.0.0.1
port            = 6600
interval        = 2
format-online   = <icon-prev><toggle><icon-next>
format-offline  = <label-offline>
label-offline = "󰝛 No Music"
icon-play               = " %{T4} "
icon-pause              = " %{T4} "
icon-stop               = " %{T4} "
icon-prev               = "%{T4} "
icon-prev-foreground	= ${color.blue}
icon-next               = " %{T4}"
icon-next-foreground	= ${color.blue}

format-offline-foreground = ${color.grey}
toggle-off-foreground   = ${color.red}
toggle-on-foreground    = ${color.green}

[module/mpd]
type                    = internal/mpd
host                    = 127.0.0.1
port                    = 6600
interval        		= 2
format-online           = "%{F#ee5396}[%{F-} %{A1:OpenApps --music:}<label-song>%{A} %{F#ee5396}]%{F-}"
format-offline          = ""
label-song              = "%title%"
label-song-maxlen		= 18
icon-repeat             = ""
icon-repeat-font		= 4

#####################################################

[module/mplayer]
type = custom/text
label = " "
label-font = 4
label-foreground = ${color.blue}

click-left = OpenApps --player
click-right = OpenApps --music

[module/usercard]
type = custom/text
label =  " "
label-font = 4
label-foreground = ${color.blue}

click-left = OpenApps --usercard

[module/power]
type = custom/text
label = ""
label-font = 4
label-foreground = ${color.blue}

click-left = OpenApps --powermenu

#####################################################

[module/tray]
type = internal/tray

format = <tray>
format-background = ${color.bg}
tray-background = ${color.bg}
tray-foreground = ${color.blue}
tray-spacing = 8px
tray-padding = 0px
tray-size = 46%

#####################################################

[module/bluetooth]
type = custom/script
exec = bluetooth-polybar.sh
interval = 3

format = <label>
format-font = 4
label = "%output%"
click-left = OpenApps --bluetooth

#####################################################

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-prefix = " "
format-prefix-font = 4
format-prefix-foreground = ${color.blue}

label-layout = %{A1:OpenApps --keyboard:}%layout%%{A}

#####################################################

[module/colorpicker]
type = custom/text
label = ""
label-font = 4
label-foreground = ${color.blue}
label-padding = 1
click-left = Colorpicker

#####################################################

[module/layout]
type = custom/ipc
hook-0 = Layout icon
initial = 1

label-font = 5
label-foreground = ${color.blue}
click-left = Layout next
click-right = Layout prev

[module/notifications]
type = custom/ipc
hook-0 = NotifyCenter --bar
initial = 1
format = <label>
label = %output%
label-font = 6
label-foreground = ${color.blue}
click-left = NotifyCenter
click-right = NotifyCenter --dnd
######################################################
