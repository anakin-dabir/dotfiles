######################################################

[module/date]
type = internal/date

interval = 1.0

time = %I:%M %P

format = "%{A1:BarPanel calendar:}<label>%{A}"
format-prefix-background = ${color.indigo}
format-prefix-foreground= ${color.bg}
label-padding = 4 pt
label = "%time%%date%"
label-background = ${color.indigo}
label-foreground= ${color.bg}

######################################################

[module/filesystem]
type = internal/fs

mount-0 = /
interval = 60
fixed-values = false

format-mounted = <label-mounted>
format-mounted-suffix = "%{A}"
format-mounted-prefix = "%{A1:BarPanel disk:}"
format-mounted-prefix-padding = 4 pt
format-mounted-prefix-foreground = ${color.bg}
format-mounted-prefix-background = ${color.red}

format-unmounted = <label-unmounted>
format-unmounted-suffix = "%{A}"
format-unmounted-prefix = "%{A1:BarPanel disk:}"
format-unmounted-prefix-background = ${color.red}

label-mounted = %used%
label-mounted-padding-right = 4 pt
label-mounted-foreground = ${color.bg}
label-mounted-background = ${color.red}
label-unmounted = %mountpoint%: not mounted
label-unmounted-padding-right = 4 pt
label-unmounted-foreground = ${color.bg}
label-unmounted-background = ${color.red}

######################################################

[module/network]
type = internal/network
interface = ${system.sys_network_interface}

interval = 3.0
accumulate-stats = true
unknown-as-up = true
speed-unit = ""

format-connected = <label-connected>
format-connected-suffix = "%{A}"
format-connected-prefix = "%{A1:BarPanel network:}"
format-connected-prefix-padding = 4 pt
label-connected = "%netspeed%"
label-connected-padding-right = 4 pt
format-connected-prefix-foreground = ${color.bg}
format-connected-prefix-background = ${color.orange}
label-connected-foreground = ${color.bg}
label-connected-background = ${color.orange}

format-disconnected = <label-disconnected>
format-disconnected-suffix = "%{A}"
format-disconnected-prefix = "%{A1:BarPanel network:}"
format-disconnected-prefix-padding = 4 pt
format-disconnected-foreground = ${color.bg}
format-disconnected-background = ${color.orange}
label-disconnected = "Offline"
label-disconnected-padding-right = 4 pt
label-disconnected-foreground = ${color.bg}
label-disconnected-background = ${color.orange}

######################################################

[module/pulseaudio]
; custom/script instead of internal/pulseaudio: internal's left click is a
; fixed "mute"; here it opens the sound dropdown (bin/VolumeBar, bin/BarPanel)
type = custom/script
exec = VolumeBar --on '%{B@blue@}%{F@bg@}%{O4pt}%{O4pt}%{B@blue@}%{F@bg@}%percentage%%{O4pt}%{F-}%{B-}%{F-}%{B-}' --off '%{B@blue@}%{F@bg@}%{O4pt}%{O4pt}%{F-}%{B-}%{B@blue@}%{F@bg@}Muted%{O4pt}%{F-}%{B-}'
tail = true
format = <label>
label = %output%
click-left = BarPanel sound
click-right = OpenApps --soundcontrol
scroll-up = pamixer -i 5
scroll-down = pamixer -d 5

[module/brightness]
type = internal/backlight
card = ${system.sys_graphics_card}

enable-scroll = false

format = "%{A1:BarPanel battery:}<ramp><label>%{A}"
label = "%percentage%%"

ramp-0 = 󱩎
ramp-1 = 󱩎
ramp-2 = 󱩑
ramp-3 = 󱩑
ramp-4 = 󱩓
ramp-5 = 󱩓
ramp-6 = 󱩓
ramp-7 = 󱩖
ramp-8 = 󱩖
ramp-9 = 󱩖
ramp-font = 2
ramp-padding = 4pt
ramp-foreground = ${color.amber}

######################################################

[module/battery]
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
time-format = %H:%M

format-charging = "%{A1:BarPanel battery:}<animation-charging><label-charging>%{A}"
label-charging = %percentage%%

format-discharging = "%{A1:BarPanel battery:}<ramp-capacity><label-discharging>%{A}"
label-discharging = %percentage%%

format-full = <label-full>
format-full-suffix = "%{A}"
format-full-prefix = "%{A1:BarPanel battery:}"
format-full-prefix-font = 3
format-full-prefix-foreground = ${color.green}
label-full = " %percentage%%"

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${color.yellow}
ramp-capacity-font = 3
ramp-capacity-padding = 4 pt

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${color.green}
animation-charging-font = 3
animation-charging-padding = 4 pt
animation-charging-framerate = 700

######################################################

[module/weather]
type = custom/script
exec = Weather wmodule
interval = 900
format = <label>
label = "%output%"

######################################################

[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false

ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;🚽
ws-icon-default = "♟"


format = <label-state>
format-font = 3

label-focused = %icon%
label-focused-padding = 1
label-focused-foreground = ${color.lime}

label-occupied = %icon%
label-occupied-padding = 1
label-occupied-foreground= ${color.purple}

label-urgent = %icon%
label-urgent-padding = 1
label-urgent-foreground= ${color.purple}

label-empty = %icon%
label-empty-foreground = ${color.fg}
label-empty-padding = 1

label-separator = ""
label-separator-padding = 0
label-separator-foreground = ${color.bg}

######################################################

[module/title]
type = internal/xwindow

format = <label>
format-prefix = "󱂬"
format-prefix-foreground = ${color.pink}

label = %title%
label-padding = 4 pt
label-maxlen = 30

label-empty = "Arch Linux"
label-empty-padding = 4 pt
label-empty-foreground = ${color.grey}

######################################################

[module/updates]
type = custom/ipc

hook-0 = cat $HOME/.cache/Updates.txt 2>/dev/null
initial = 1

format = <label>
format-prefix = ""
format-prefix-padding = 4 pt
format-prefix-foreground = ${color.bg}
format-prefix-background = ${color.green}

label = %output%
label-padding-right = 4 pt
label-foreground = ${color.bg}
label-background = ${color.green}

click-left = OpenApps --checkupdates

######################################################

[module/launcher]
type = custom/text

label = 󰣇
label-foreground = ${color.blue}

click-left = OpenApps --menu
click-right = RiceSelector

######################################################

[module/sep]
type = custom/text
label = " "
label-foreground = ${color.bg}

######################################################

[module/sep2]
type = custom/text
label = " 󰇙 "
label-foreground = ${color.indigo}

######################################################

[module/cpu_bar]
type = internal/cpu

interval = 0.5
;; agregar <bar-load> o <ramp-load> antes de label para agregar barrita chida
format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel cpu:}"
format-prefix-padding = 4 pt
format-prefix-foreground = ${color.bg}
format-prefix-background = ${color.yellow}

label = "%percentage%%"
label-padding-right = 4 pt
label-foreground = ${color.bg}
label-background = ${color.yellow}

######################################################

[module/memory_bar]
type = internal/memory

interval = 3

format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel memory:}"
format-prefix-padding = 4 pt
format-prefix-foreground = ${color.bg}
format-prefix-background = ${color.purple}

label = "%used%"
label-padding-right = 4 pt
label-foreground = ${color.bg}
label-background = ${color.purple}

######################################################

[module/mplayer]
type = custom/text
label = ""
label-foreground = ${color.purple}

click-left = OpenApps --player
click-right = OpenApps --music

[module/usercard]
type = custom/text
label =  ""
label-foreground = ${color.yellow}

click-left = OpenApps --usercard

[module/power]
type = custom/text
label = ""
label-padding-left = 4 pt
label-foreground = ${color.red}

click-left = OpenApps --powermenu

#####################################################

[module/tray]
type = internal/tray

format = <tray>
format-background = ${color.bg}
tray-background = ${color.bg}
tray-foreground = ${color.fg}
tray-spacing = 4px
tray-padding = 0px
tray-size = 72%

#####################################################

[module/bluetooth]
type = custom/script
exec = bluetooth-polybar.sh
interval = 3

format = <label>
format-font = 2
label = "%output%"
click-left = OpenApps --bluetooth

#####################################################

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-prefix = " "
format-prefix-font = 3
format-prefix-foreground = ${color.cyan}

label-layout = %{A1:OpenApps --keyboard:}%layout%%{A}

#####################################################

[module/colorpicker]
type = custom/text
label = ""
label-foreground = ${color.cyan}
click-left = Colorpicker

#####################################################

[module/layout]
type = custom/ipc
hook-0 = Layout icon
initial = 1

label-font = 5
click-left = Layout next
click-right = Layout prev

[module/notifications]
type = custom/ipc
hook-0 = NotifyCenter --bar
initial = 1
format = <label>
label = %output%
label-font = 6
label-padding-right = 4 pt
label-foreground = ${color.bg}
label-background = ${color.green}
label-padding-left = 4 pt
click-left = NotifyCenter
click-right = NotifyCenter --dnd
######################################################
