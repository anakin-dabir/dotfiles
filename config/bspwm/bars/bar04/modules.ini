label-background          = ${color.bg}

[module/brd]
type                      = custom/text
label                     = "%{T4}%{T-}"
label-foreground          = ${color.red}
label-background          = ${color.bg}

[module/byd]
type                      = custom/text
label                     = "%{T4}%{T-}"
label-foreground          = ${color.yellow}
label-background          = ${color.bg}

[module/bpd]
type                      = custom/text
label                     = "%{T4}%{T-}"
label-foreground          = ${color.purple}
label-background          = ${color.bg}

[module/bbd]
type                      = custom/text
label                     = "%{T4}%{T-}"
label-foreground          = ${color.blue}
label-background          = ${color.bg}

[module/bod]
