[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = ../colors.ini
include-file = modules.ini

[bar/cristina-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = true
fixed-center = false

width = 95%
height = 20

offset-x = 2.5%
offset-y = 5

background = ${color.bg}
foreground = ${color.fg}

radius-bottom = 1

line-size = 3
line-color = ${color.blue}

border-size = 14
border-color = ${color.bg}

padding-left = 2
padding-right = 1

module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono:style=Bold:pixelsize=9;2"
font-1 = "Material Design Icons Desktop:size=13;3"
font-2 = "Font Awesome 6 Free Solid:size=10;3"
font-3 = "MesloLGS NF:style=Regular:size=13;3"
font-4 = "Material Design Icons Desktop:size=12;3"
; notification bell (bin/NotifyCenter)
font-5 = "Symbols Nerd Font:size=12;3"

;Modules availables but not active:
;	brightness      xkeyboard
modules-left = launcher sep2 bspwm sep2 title
modules-center =
modules-right = layout sep colorpicker sep weather sep bluetooth sep usercard sep mplayer sep battery sep bgi updates bgd bgi notifications bgd bri filesystem brd byi cpu_bar byd bpi memory_bar bpd bbi pulseaudio bbd boi network bod bii date bid sep tray sep power

separator =
dim-value = 1.0
;locale = es_MX.UTF-8

wm-restack = bspwm
enable-struts = true
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false

; Icons of the shared bar items (config/system.ini); Control Center > Bar
; changes them. font: which font-N draws them, plus one (0 = any font)
[icons]
font = 0
media = 󰽴
clipboard = 󰅌
capture = 󰵝
