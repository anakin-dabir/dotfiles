[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = ../colors.ini
include-file = modules.ini

[bar/aline-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = false

width = 82%
height = 28

offset-x = 9%
offset-y = 0

background = ${color.bg}
foreground = ${color.fg}

radius-bottom = 1.0

line-size = 2
line-color = ${color.blue}

border-size = 11px
border-color = ${color.bg}

padding-left = 1
padding-right = 1

module-margin-left = 0
module-margin-right = 0

font-0 = "Inconsolata Semi Condensed Bold:size=11;1"
font-1 = "Font Awesome 6 Free Solid:size=11;3"
font-2 = "Material Design Icons Desktop:size=17;4"
font-3 = "MesloLGS NF:style=Regular:size=17;4"
font-4 = "Font Awesome 6 Free Solid:size=9;3"
font-5 = "Material Design Icons Desktop:size=13;4"
font-6 = "Material Design Icons Desktop:size=10;2"
; notification bell (bin/NotifyCenter)
font-7 = "Symbols Nerd Font:size=13;4"

;Modules availables but not active:
;	brightness	xkeyboard
modules-left = launcher sep bi bspwm bd sep usercard mplayer power layout
modules-center = bi date weather bd
modules-right = colorpicker bluetooth sep bi filesystem cpu_bar memory_bar bd sep bi battery pulseaudio network bd sep bi updates bd sep bi notifications bd sep tray

separator =
dim-value = 1.0

;;locale = es_MX.UTF-8

wm-restack = bspwm
enable-struts = true
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false

; Icons of the shared bar items (config/system.ini); Control Center > Bar
; changes them. *-font: which font-N draws it, plus one (0 = any font)
[icons]
media = 󰽴
clipboard = 󰅌
capture = 󰵝
media-font = 0
clipboard-font = 0
capture-font = 0
