; __  __           _       _


[module/date]
type = internal/date

interval = 1.0

time = %I:%M %P
format-background = ${color.pill}
format-foreground = ${color.fg}

format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel calendar:}"
format-prefix-font = 2
format-prefix-background = ${color.pill}
format-prefix-foreground = ${color.blue}

label = " %time%%date% "

######################################################

[module/filesystem]
type = internal/fs

mount-0 = /
interval = 60
fixed-values = true

format-mounted = <label-mounted>
format-mounted-suffix = "%{A}"
format-mounted-prefix = "%{A1:BarPanel disk:}  "
format-mounted-prefix-font = 2
format-mounted-prefix-background = ${color.pill}
format-mounted-prefix-foreground = ${color.blue}

format-unmounted = <label-unmounted>
format-unmounted-suffix = "%{A}"
format-unmounted-prefix-font = 2
format-unmounted-prefix = "%{A1:BarPanel disk:}  "

label-mounted = "%used% "
label-mounted-background = ${color.pill}

label-unmounted = "%mountpoint%: not mounted "

######################################################

[module/network]
type = internal/network
interface = ${system.sys_network_interface}

interval = 3.0
accumulate-stats = true
unknown-as-up = true

format-connected = <label-connected>
format-connected-suffix = "%{A}"
format-connected-prefix = "%{A1:BarPanel network:} "
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${color.blue}

speed-unit = ""
label-connected = "%local_ip% "

format-disconnected = <label-disconnected>
format-disconnected-suffix = "%{A}"
format-disconnected-prefix = "%{A1:BarPanel network:} "
format-disconnected-prefix-font = 2
format-disconnected-prefix-foreground = ${color.blue}

label-disconnected = "Offline "
label-disconnected-foreground = ${color.blue}

######################################################

[module/pulseaudio]
; custom/script instead of internal/pulseaudio: internal's left click is a
; fixed "mute"; here it opens the sound dropdown (bin/VolumeBar, bin/BarPanel)
type = custom/script
exec = VolumeBar --on '%{B@pill@}%{F@blue@}%{T2} %{T-}%{B@pill@}%{F@fg@} %percentage% %{F-}%{B-}%{F-}%{B-}' --off '%{B@pill@}%{F@blue@}%{T2} %{T-}%{B@pill@}%{F@red@} Muted %{F-}%{B-}%{F-}%{B-}' --ramp '||||'
tail = true
format = <label>
label = %output%
click-left = BarPanel sound
click-right = OpenApps --soundcontrol
scroll-up = pamixer -i 5
scroll-down = pamixer -d 5

[module/brightness]
type = internal/backlight
card = ${system.sys_graphics_card}

enable-scroll = false

format = "%{A1:BarPanel battery:}<ramp><label>%{A}"
format-background = ${color.pill}
label = "%percentage%% "
label-padding-left = 3pt

ramp-0 = " "
ramp-1 = " "
ramp-2 = " "
ramp-font = 2
ramp-foreground = ${color.yellow}

######################################################

[module/battery]
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
time-format = %H:%M

format-charging = "%{A1:BarPanel battery:}<animation-charging><label-charging>%{A}"
format-charging-background = ${color.pill}
label-charging = " %percentage%% "

format-discharging = "%{A1:BarPanel battery:}<ramp-capacity><label-discharging>%{A}"
format-discharging-background = ${color.pill}
label-discharging = " %percentage%% "

format-full = <label-full>
format-full-suffix = "%{A}"
format-full-background = ${color.pill}
format-full-prefix = "%{A1:BarPanel battery:} "
format-full-prefix-font = 2
format-full-prefix-foreground = ${color.green}
label-full = " %percentage%% "

ramp-capacity-0 = " "
ramp-capacity-1 = " "
ramp-capacity-2 = " "
ramp-capacity-3 = " "
ramp-capacity-4 = " "
ramp-capacity-foreground = ${color.blue}
ramp-capacity-font = 2

animation-charging-0 = " "
animation-charging-1 = " "
animation-charging-2 = " "
animation-charging-3 = " "
animation-charging-4 = " "
animation-charging-foreground = ${color.green}
animation-charging-font = 2
animation-charging-framerate = 700

######################################################

[module/weather]
type = custom/script
exec = Weather wmodule
interval = 900
format = <label>
label = "%output%"

######################################################

[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false


format = <label-state>
format-font = 3

label-focused = 󱓇
label-focused-background = ${color.pill}
label-focused-padding = 2
label-focused-foreground = ${color.yellow}

label-occupied = 󰚌
label-occupied-padding = 2
label-occupied-background = ${color.pill}
label-occupied-foreground= ${color.blue}

label-urgent = 󰚌
label-urgent-padding = 2
label-urgent-background = ${color.pill}
label-urgent-foreground= ${color.blue}

label-empty = 󰑊
label-empty-padding = 2
label-empty-background = ${color.pill}
label-empty-foreground = ${color.purple}

######################################################

[module/updates]
type = custom/ipc

hook-0 = cat $HOME/.cache/Updates.txt 2>/dev/null
initial = 1

format = <label>
format-prefix = "  "
format-prefix-font = 2
format-prefix-background = ${color.pill}
format-prefix-foreground = ${color.blue}

label = "%output% "
label-background = ${color.pill}

click-left = OpenApps --checkupdates

######################################################

[module/launcher]
type = custom/text

label = 󰣇
label-foreground = ${color.yellow}
label-font = 4

click-left = OpenApps --menu
click-right = RiceSelector

######################################################

[module/sep]
type = custom/text
label = " "
label-foreground = ${color.bg}

######################################################

[module/dots]
type = custom/text
label = " 󰇙 "
label-font = 3
label-foreground = ${color.blue}

######################################################

[module/cpu_bar]
type = internal/cpu

interval = 0.5

format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel cpu:}  "
format-prefix-font = 2
format-prefix-background = ${color.pill}
format-prefix-foreground = ${color.blue}

label = "%percentage%% "
label-background = ${color.pill}

######################################################

[module/memory_bar]
type = internal/memory

interval = 3

format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel memory:}  "
format-prefix-font = 2
format-prefix-background = ${color.pill}
format-prefix-foreground = ${color.blue}

label = "%used% "
label-background = ${color.pill}

######################################################

[module/mpd_control]
type            = internal/mpd
host            = 127.0.0.1
port            = 6600
interval        = 2
format-online   = <icon-prev><toggle><icon-next>
format-offline  = <label-offline>
label-offline = "󰝛 No Music"
icon-play               = " %{T2} "
icon-pause              = " %{T2} "
icon-stop               = " %{T2} "
icon-prev               = "%{T2} "
icon-next               = " %{T2}"

format-offline-foreground = ${color.grey}
toggle-off-foreground   = ${color.red}

[module/mpd]
type                    = internal/mpd
host                    = 127.0.0.1
port                    = 6600
interval        		= 2
format-online           = "%{F#9ece6a}[%{F-} %{A1:OpenApps --music:}<label-song>%{A} %{F#9ece6a}]%{F-}"
format-offline          = ""
label-song              = "%title%"
label-song-maxlen		= 18
icon-repeat             = ""
icon-repeat-font		= 2

icon-repeat-background  = ${color.bg}
toggle-on-foreground    = ${color.green}
toggle-off-foreground   = ${color.red}

#####################################################

[module/mplayer]
type = custom/text
label = "  "
label-background = ${color.pill}
label-foreground = ${color.blue}

click-left = OpenApps --player
click-right = OpenApps --music

[module/usercard]
type = custom/text
label =  "  "
label-background = ${color.pill}
label-foreground = ${color.blue}

click-left = OpenApps --usercard

[module/power]
type = custom/text
label = ""
label-foreground = ${color.red}

click-left = OpenApps --powermenu

#####################################################

[module/tray]
type = internal/tray

format = <tray>
format-background = ${color.bg}
tray-background = ${color.bg}
tray-foreground = ${color.fg}
tray-spacing = 8px
tray-padding = 0px
tray-size = 63%

#####################################################

[module/bluetooth]
type = custom/script
exec = bluetooth-polybar.sh
interval = 3

format = <label>
format-font = 3
label = "%output%"
click-left = OpenApps --bluetooth

#####################################################

[module/vpn]
type = internal/network
interface = tun0

format-connected-prefix = " "
format-connected-prefix-font = 2
label-connected = "%local_ip% "
format-connected-prefix-foreground = ${color.blue}

[module/target]
type=custom/script
exec = ~/.config/bspwm/bin/target
interval = 2
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = #b53737

#####################################################

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-prefix = "  "
format-prefix-background = ${color.pill}
format-prefix-foreground = ${color.blue}
format-prefix-font = 2

label-layout = "%{A1:OpenApps --keyboard:}%layout%%{A} "
label-layout-background = ${color.pill}

#####################################################

[module/colorpicker]
type = custom/text
label = ""
label-foreground = ${color.blue}
click-left = Colorpicker

#####################################################

[module/layout]
type = custom/ipc
hook-0 = Layout icon
initial = 1

label-font = 3
click-left = Layout next
click-right = Layout prev

[module/notifications]
type = custom/ipc
hook-0 = NotifyCenter --bar
initial = 1
format = <label>
label = "%output% "
label-font = 3
label-background = ${color.pill}
label-foreground = ${color.blue}
click-left = NotifyCenter
click-right = NotifyCenter --dnd
######################################################
