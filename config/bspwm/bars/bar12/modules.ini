; __  __           _       _


[module/bdgg]
type = custom/text
label = "%{T5}%{T-}"
label-foreground = ${color.bg}
label-background = ${color.bg-alt}

[module/bdv]
type = custom/text
label = "%{T5}%{T-}"
label-foreground = ${color.bg}
label-background = ${color.bg-alt}

######################################################

[module/date]
type = internal/date

interval = 1.0

time = %I:%M %P
format-background = ${color.bg-alt}
format-foreground = ${color.fg}

format = "%{A1:BarPanel calendar:}<label>%{A}"
label = "%time%%date%"

######################################################

[module/filesystem]
type = internal/fs

mount-0 = /
interval = 60
fixed-values = true

format-mounted = <label-mounted>
format-mounted-suffix = "%{A}"
format-mounted-prefix = "%{A1:BarPanel disk:} "
format-mounted-prefix-font = 2
format-mounted-prefix-background = ${color.bg}
format-mounted-prefix-foreground = ${color.yellow}

format-unmounted = <label-unmounted>
format-unmounted-suffix = "%{A}"
format-unmounted-prefix-font = 2
format-unmounted-prefix = "%{A1:BarPanel disk:} "

label-mounted = %used%
label-mounted-background = ${color.bg}

label-unmounted = %mountpoint%: not mounted

######################################################

[module/network]
type = internal/network
interface = ${system.sys_network_interface}

interval = 3.0
accumulate-stats = true
unknown-as-up = true

format-connected = <label-connected>
format-connected-suffix = "%{A}"
format-connected-prefix = "%{A1:BarPanel network:} "
format-connected-prefix-font = 2
format-connected-background = ${color.bg}
format-connected-foreground = ${color.green}

speed-unit = ""
label-connected = "%netspeed%"
label-connected-background = ${color.bg}
label-connected-foreground = ${color.amber}

format-disconnected = <label-disconnected>
format-disconnected-suffix = "%{A}"
format-disconnected-prefix = "%{A1:BarPanel network:} "
format-disconnected-prefix-font = 2
format-disconnected-prefix-background = ${color.bg}
format-disconnected-foreground = ${color.red}

label-disconnected = "Offline"
label-disconnected-background = ${color.bg}
label-disconnected-foreground = ${color.red}

######################################################

[module/pulseaudio]
; custom/script instead of internal/pulseaudio: internal's left click is a
; fixed "mute"; here it opens the sound dropdown (bin/VolumeBar, bin/BarPanel)
type = custom/script
exec = VolumeBar --on '%{B@bg@}%{F@blue@}%{T2}%{T-}%{B@bg@}%{F@fg@} %percentage%%{F-}%{B-}%{F-}%{B-}' --off '%{B@bg@}%{F@blue@}%{T2}%{T-}%{B@bg@}%{F@red@} Muted%{F-}%{B-}%{F-}%{B-}'
tail = true
format = <label>
label = %output%
click-left = BarPanel sound
click-right = OpenApps --soundcontrol
scroll-up = pamixer -i 5
scroll-down = pamixer -d 5

[module/brightness]
type = internal/backlight
card = ${system.sys_graphics_card}

enable-scroll = false

format = "%{A1:BarPanel battery:}<ramp><label>%{A}"
format-background = ${color.bg}
label = " %percentage%%"

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-font = 2
ramp-foreground = ${color.yellow}

######################################################

[module/battery]
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
time-format = %H:%M

format-charging = "%{A1:BarPanel battery:}<animation-charging><label-charging>%{A}"
label-charging-background = ${color.bg}
label-charging = " %percentage%%"

format-discharging = "%{A1:BarPanel battery:}<ramp-capacity><label-discharging>%{A}"
format-discharging-background = ${color.bg}
label-discharging = " %percentage%%"
label-discharging-background = ${color.bg}


format-full = <label-full>
format-full-suffix = "%{A}"
format-full-prefix = "%{A1:BarPanel battery:} "
format-full-prefix-font = 2
format-full-prefix-background = ${color.bg}
format-full-prefix-foreground = ${color.green}
label-full-background = ${color.bg}
label-full = "%percentage%%"

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-background = ${color.bg}
ramp-capacity-foreground = ${color.yellow}
ramp-capacity-font = 2

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-background = ${color.bg}
animation-charging-foreground = ${color.green}
animation-charging-font = 2
animation-charging-framerate = 700

######################################################
[module/weather]
type = custom/script
exec = Weather wmodule
interval = 900
format = <label>
label = " %output% "

######################################################

[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false

format = <label-state>
format-font = 3

label-focused = 󰮯
label-focused-padding = 1
label-focused-background = ${color.bg}
label-focused-foreground = ${color.yellow}

label-occupied = 󰊠
label-occupied-padding = 1
label-occupied-background = ${color.bg}
label-occupied-foreground= ${color.blue}

label-urgent = 󰊠
label-urgent-padding = 1
label-urgent-background = ${color.bg}
label-urgent-foreground= ${color.blue}

label-empty = 󰑊
label-empty-padding = 1
label-empty-background = ${color.bg}
label-empty-foreground = ${color.purple}

######################################################

[module/title]
type = internal/xwindow

format = "%{A1:BarPanel windows:}<label>%{A}"
format-prefix = "󱂬 "
format-prefix-foreground = ${color.purple}
format-prefix-font = 3

label = %title%
label-maxlen = 35
label-foreground = ${color.cyan}

label-empty = Arch Linux
label-empty-foreground = ${color.blue-gray}

######################################################

[module/updates]
type = custom/ipc

hook-0 = cat $HOME/.cache/Updates.txt 2>/dev/null
initial = 1

format = <label>
format-prefix = " "
format-prefix-font = 2
format-prefix-background = ${color.bg}
format-prefix-foreground = ${color.green}

label = %output%
label-background = ${color.bg}

click-left = OpenApps --checkupdates

######################################################

[module/launcher]
type = custom/text

label = "󰣇"
label-background = ${color.bg}
label-foreground = ${color.fg}
label-font = 4

click-left = OpenApps --menu
click-right = RiceSelector

######################################################

[module/sep]
type = custom/text
label = " "
label-background = ${color.bg}

[module/sept]
type = custom/text
label = " "
label-background = ${color.bg-alt}

######################################################

[module/dots]
type = custom/text
label = " 󰇙 "
label-font = 3
label-foreground = ${color.blue-gray}

######################################################

[module/cpu_bar]
type = internal/cpu

interval = 0.5

format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel cpu:} "
format-prefix-font = 2
format-prefix-background = ${color.bg}
format-prefix-foreground = ${color.red}

label = "%percentage%%"
label-background = ${color.bg}

######################################################

[module/memory_bar]
type = internal/memory

interval = 3

format = <label>
format-suffix = "%{A}"
format-prefix = "%{A1:BarPanel memory:} "
format-prefix-font = 2
format-prefix-background = ${color.bg}
format-prefix-foreground = ${color.cyan}

label = %used%
label-background = ${color.bg}

######################################################

[module/mpd_control]
type            = internal/mpd
host            = 127.0.0.1
port            = 6600
interval        = 2
format-online   = <icon-prev><toggle><icon-next>
format-offline  = <label-offline>
label-offline = "󰝛 No Music"
icon-play               = " %{T2} "
icon-pause              = " %{T2} "
icon-stop               = " %{T2} "
icon-prev               = "%{T2} "
icon-next               = " %{T2}"

format-offline-background = ${color.bg}
format-offline-foreground = ${color.purple}
icon-play-background    = ${color.bg}
icon-pause-background   = ${color.bg}
icon-stop-background    = ${color.bg}
icon-prev-background    = ${color.bg}
icon-next-background    = ${color.bg}
icon-play-foreground    = ${color.green}
icon-pause-foreground   = ${color.green}
icon-stop-foreground    = ${color.green}
icon-prev-foreground    = ${color.blue}
icon-next-foreground    = ${color.blue}
toggle-on-foreground    = ${color.green}
toggle-off-foreground   = ${color.red}

#####################################################

[module/mplayer]
type = custom/text
label = ""
label-padding = 3pt
label-background = ${color.bg}
label-foreground = ${color.green}

click-left = OpenApps --player
click-right = OpenApps --music

[module/usercard]
type = custom/text
label =  ""
label-padding = 3pt
label-background = ${color.bg}
label-foreground = ${color.cyan}

click-left = OpenApps --usercard

[module/power]
type = custom/text
label = ""
;;label-padding = 3pt
label-background = ${color.bg}
label-foreground = ${color.red}

click-left = BarPanel power

#####################################################

[module/tray]
type = internal/tray

format = <tray>
format-background = ${color.bg-alt}
tray-background = ${color.bg-alt}
tray-foreground = ${color.fg}
tray-spacing = 4px
tray-padding = 0px
tray-size = 55%

#####################################################

[module/bluetooth]
type = custom/script
exec = bluetooth-polybar.sh
interval = 3

format = <label>
format-font = 3
label = "%output%"
label-background = ${color.bg}
click-left = OpenApps --bluetooth

#####################################################

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-background = ${color.bg}
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${color.purple}

label-layout = %{A1:OpenApps --keyboard:}%layout%%{A}

#####################################################

[module/colorpicker]
type = custom/text
label = ""
label-background = ${color.bg}
label-foreground = ${color.purple}
label-padding = 3pt
click-left = Colorpicker

#####################################################

[module/layout]
type = custom/ipc
hook-0 = Layout icon
initial = 1

label-font = 3
format-background = ${color.bg}
label-foreground = ${color.purple}
click-left = Layout next
click-right = Layout prev

[module/notifications]
type = custom/ipc
hook-0 = NotifyCenter --bar
initial = 1
format = <label>
label = %output%
label-font = 6
label-background = ${color.bg}
label-foreground = ${color.green}
click-left = NotifyCenter
click-right = NotifyCenter --dnd
######################################################
