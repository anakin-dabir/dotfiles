; ____       _       _

[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = ../colors.ini
include-file = modules.ini

[bar/marisol]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 35

offset-x = 0
offset-y = 0

background = ${color.bg-alt}
foreground = ${color.fg}

radius = 0

line-size = 2
line-color = ${color.blue}

border-top = 5px
border-color = ${color.bg}

padding = 0

module-margin-left = 0
module-margin-right = 0

; Text
font-0 = "JetBrainsMono:style=Bold:size=9;3"
; Icons
font-1 = "Font Awesome 6 Free Solid:size=9;3"
font-2 = "Material Design Icons Desktop:size=11;3"
font-3 = "Material Design Icons Desktop:size=15;3"
; Glyphs
font-4 = "MesloLGS NF:style=Regular:size=21;4"
; notification bell (bin/NotifyCenter)
font-5 = "Symbols Nerd Font:size=11;3"
;dpi = 96

;Modules availables but not active:
;	brightness		xkeyboard
modules-left = sep launcher sep sep bspwm sep sep mpd_control sep sep layout sep bdgg sept title
modules-center = date sept weather
modules-right = tray bdv colorpicker usercard mplayer sep bluetooth sep sep battery sep sep cpu_bar sep sep memory_bar sep sep filesystem sep sep network sep sep pulseaudio sep sep updates sep sep notifications sep sep power sep

separator =
dim-value = 1.0

;;locale = es_MX.UTF-8

wm-restack = bspwm
enable-struts = true
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false

; Icons of the shared bar items (config/system.ini); Control Center > Bar
; changes them. font: which font-N draws them, plus one (0 = any font)
[icons]
font = 0
media = 󰽴
clipboard = 󰅌
capture = 󰵝
